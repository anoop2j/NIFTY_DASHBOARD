name: Update Nifty 100 Multi Screener

on:

  schedule:

    # 5:30 AM IST = 12:00 AM UTC
    - cron: "0 0 * * *"

  workflow_dispatch:


permissions:

  contents: write


jobs:

  update-stock-data:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Run Multi Screener
        run: |

          python multi_screener.py


      - name: Commit Updated Dashboard
        run: |

          git config --global user.name "GitHub Actions"

          git config --global user.email "actions@github.com"

          git add docs/index.html

          git diff --quiet && git diff --staged --quiet || git commit -m "Daily Nifty 100 Multi Screener Update"

          git push
